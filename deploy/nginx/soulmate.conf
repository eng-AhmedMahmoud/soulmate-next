# Soul Mate on the Devya VPS: nginx serves the Next static export from
# /home/devya/projects/soulmate/current (a symlink to releases/<sha>, see
# scripts/deploy-vps.sh). No container, no Node: every page is a file.
#
# Two server blocks with the same content, so each name keeps its own certificate:
# - soulmate.devya.dev: live now (A record in the devya.dev Cloudflare zone).
# - www.soulmatebeautysalon.com: the client's name. Its DNS is in the client's
#   Hostinger account and still points at Vercel; once it points here, the
#   `pending-certs` cron issues its certificate. The bare soulmatebeautysalon.com
#   already 301s to www (apex-soulmatebeautysalon.com, apex-redirect).
# Installed by `bash scripts/deploy-vps.sh --setup`; certbot --nginx adds the 443
# servers and the http -> https redirects.
server {
    listen 80;
    listen [::]:80;
    server_name soulmate.devya.dev;

    root /home/devya/projects/soulmate/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.soulmatebeautysalon.com;

    root /home/devya/projects/soulmate/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;
}
